<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わびや 冷麺ポスター v3 - 涼 白基調和モダン</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@200;400;700&family=Zen+Old+Mincho:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @page { size: A4 portrait; margin: 0; }

    body {
      margin: 0;
      padding: 0;
      background: #e8e3d5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .poster {
      width: 595px;
      height: 842px;
      position: relative;
      overflow: hidden;
      background: #f5f0e6;
      font-family: 'Shippori Mincho', 'Zen Old Mincho', serif;
      color: #1a1a1a;
    }

    /* 和紙風背景テクスチャ */
    .paper-tex {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(29,73,116,0.04), transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(29,73,116,0.06), transparent 50%),
        repeating-linear-gradient(45deg, transparent 0, transparent 3px, rgba(120,90,40,0.012) 3px, rgba(120,90,40,0.012) 4px);
      pointer-events: none;
    }

    /* 藍染めグラデ（上 + 下） */
    .aizome-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(180deg, #1d4974 0%, rgba(29,73,116,0.85) 40%, rgba(29,73,116,0.4) 70%, transparent 100%);
      pointer-events: none;
    }
    .aizome-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: linear-gradient(0deg, #1d4974 0%, rgba(29,73,116,0.75) 50%, transparent 100%);
      pointer-events: none;
    }

    /* 七宝紋（青海波） */
    .seigaiha {
      position: absolute;
      top: 30px;
      left: 0;
      right: 0;
      height: 22px;
      opacity: 0.5;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 76px 44px 56px;
      display: flex;
      flex-direction: column;
    }

    /* 上部 英字＋夏季限定 */
    .top-label {
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 3;
    }
    .top-label .en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.6em;
      color: rgba(255,255,255,0.9);
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .top-label .jp {
      font-family: 'Shippori Mincho', serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.4em;
      color: #fff;
    }

    /* 涼の大書 */
    .ryo-wrap {
      position: relative;
      text-align: center;
      margin-top: 20px;
      margin-bottom: -8px;
    }
    .ryo {
      font-family: 'Zen Old Mincho', serif;
      font-weight: 900;
      font-size: 280px;
      line-height: 0.9;
      color: #1d4974;
      letter-spacing: -0.04em;
      position: relative;
      display: inline-block;
      text-shadow: 4px 4px 0 rgba(212,73,58,0.08);
    }
    /* 判子 */
    .hanko {
      position: absolute;
      top: 12px;
      right: 92px;
      width: 50px;
      height: 50px;
      background: #d4493a;
      color: #fff;
      font-family: 'Zen Old Mincho', serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-3deg);
      border-radius: 3px;
      box-shadow: 1px 1px 0 rgba(0,0,0,0.1);
    }
    .hanko::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 1px;
    }

    /* サブタイトル */
    .sub {
      text-align: center;
      margin-top: 4px;
    }
    .sub h2 {
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.25em;
      color: #1a1a1a;
    }
    .sub h2 .accent {
      color: #d4493a;
    }
    .sub .en {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.45em;
      color: #1d4974;
      margin-top: 6px;
    }

    /* 写真 */
    .photo-wrap {
      position: relative;
      width: 300px;
      height: 240px;
      margin: 16px auto 16px;
    }
    .photo-frame {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 4px;
      box-shadow:
        0 6px 24px rgba(29,73,116,0.18),
        0 0 0 4px #fff,
        0 0 0 5px rgba(29,73,116,0.25);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1.05) saturate(1.05);
    }
    /* 写真の左右に「すだち」マーク */
    .sudachi {
      position: absolute;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle at 40% 35%, #b8d65a, #5a8a2a 80%);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(90,138,42,0.4);
    }
    .sudachi.s1 { top: -10px; left: -16px; transform: rotate(-15deg); }
    .sudachi.s2 { bottom: -12px; right: -14px; width: 22px; height: 22px; }

    /* キャプション */
    .caption {
      text-align: center;
      margin-bottom: 18px;
    }
    .caption p {
      font-family: 'Shippori Mincho', serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 2;
      letter-spacing: 0.18em;
      color: #2a2a2a;
    }

    /* 価格 */
    .price-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 14px;
      margin: 6px 0 14px;
    }
    .price-row .l {
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #1d4974 50%, transparent);
    }
    .price {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      color: #1d4974;
      font-size: 36px;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .price .tax {
      font-size: 12px;
      letter-spacing: 0.2em;
      margin-left: 6px;
      color: rgba(29,73,116,0.7);
    }

    /* ボトム */
    .bottom {
      text-align: center;
      margin-top: auto;
      padding-top: 6px;
      color: #fff;
      position: relative;
      z-index: 3;
    }
    .bottom .avail {
      font-family: 'Shippori Mincho', serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.95);
      margin-bottom: 10px;
    }
    .bottom .brand {
      font-family: 'Zen Old Mincho', serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5em;
      color: #fff;
    }

    @media print {
      body { background: #fff; }
      .poster { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="poster">
  <div class="paper-tex"></div>

  <!-- 上部の藍染め -->
  <div class="aizome-top"></div>

  <!-- 青海波（七宝紋） -->
  <svg class="seigaiha" viewBox="0 0 595 22" preserveAspectRatio="none">
    <defs>
      <pattern id="wave" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="11" cy="22" r="11" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.5"/>
        <circle cx="0" cy="22" r="11" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.5"/>
        <circle cx="22" cy="22" r="11" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.5"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="595" height="22" fill="url(#wave)"/>
  </svg>

  <!-- 下部の藍染め -->
  <div class="aizome-bottom"></div>

  <div class="content">

    <div class="top-label">
      <div class="en">S U M M E R &nbsp; L I M I T E D</div>
      <div class="jp">夏 季 限 定</div>
    </div>

    <!-- 涼 大書 -->
    <div class="ryo-wrap">
      <span class="ryo">涼</span>
      <span class="hanko">夏限</span>
    </div>

    <div class="sub">
      <h2>さっぱり<span class="accent">冷麺</span></h2>
      <div class="en">C O L D &nbsp; N O O D L E</div>
    </div>

    <div class="photo-wrap">
      <span class="sudachi s1"></span>
      <div class="photo-frame">
        <img src="../images/reimen.webp" alt="冷麺">
      </div>
      <span class="sudachi s2"></span>
    </div>

    <div class="caption">
      <p>
        つるりと喉に抜ける、しこしこ麺。<br>
        キ ム チ と き ゅ う り を 添 え て 、<br>
        夏 に ぴ っ た り の 一 杯 。
      </p>
    </div>

    <div class="price-row">
      <span class="l"></span>
      <span class="price">¥ 900<span class="tax">（税込）</span></span>
      <span class="l"></span>
    </div>

    <div class="bottom">
      <div class="avail">ランチ ／ ディナー　両時間帯でご注文いただけます</div>
      <div class="brand">焼 肉 和 火 焼 ・ わ び や</div>
    </div>

  </div>
</div>

</body>
</html>
